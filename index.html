<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GGS Separator Digital Twin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: the plant fills a dark room; a short written account sits top-left, readings in a quiet column on the right,
   and a thin time strip with the two model scores along the bottom. Dark ground, light objects, muted earth tones. */
:root{
  --bg:#16191b; --raise:rgba(30,34,37,.82); --raise-solid:#1e2225; --line:rgba(236,231,221,.10); --line2:rgba(236,231,221,.2);
  --fg:#ece7dd; --fg2:#b6b0a5; --fg3:#7f7a71;
  --sage:#9db196; --slate:#8ea3b6; --ochre:#d2a85e; --brick:#c9715d;
  --serif:"Spectral",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gx:max(16px, env(safe-area-inset-left, 0px)); --gxr:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}
#stage canvas{display:block;outline:none}
#labels{position:fixed;inset:0;pointer-events:none;z-index:2}
button,select{font:inherit;color:inherit}
:focus-visible{outline:1.5px solid var(--sage);outline-offset:3px;border-radius:3px}
.num{font-variant-numeric:tabular-nums}
.small{font-size:12px;color:var(--fg3)}

/* ---------- top-left: the written account ---------- */
.intro{position:fixed;z-index:5;text-shadow:0 1px 10px rgba(22,25,27,.9),0 0 2px rgba(22,25,27,.8);top:calc(26px + env(safe-area-inset-top,0px));left:calc(var(--gx) + 12px);width:min(440px,calc(100% - 48px))}
.intro .kicker{font-size:12px;color:var(--fg3);letter-spacing:.02em}
.intro h1{margin:4px 0 0;font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.08;letter-spacing:-.005em;text-wrap:balance}
.intro h1 em{font-style:italic;color:var(--fg2);font-weight:400}
.now{margin:14px 0 0;font-family:var(--serif);font-size:17px;line-height:1.5;color:var(--fg2);max-width:40ch;min-height:3em}
.now b{color:var(--fg);font-weight:500}
.now .w{color:var(--ochre)} .now .a{color:var(--brick)} .now .s{color:var(--slate)}
.views{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:18px;font-size:12.5px}
.views button{background:none;border:0;padding:2px 0;cursor:pointer;color:var(--fg3);border-bottom:1px solid transparent}
.views button:hover{color:var(--fg2)}
.views button[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--sage)}

/* ---------- top-right: choices ---------- */
.ctl{position:fixed;z-index:5;top:calc(26px + env(safe-area-inset-top,0px));right:calc(var(--gxr) + 12px);display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 500px)}
.sel{appearance:none;background:transparent;border:0;border-bottom:1px solid var(--line2);border-radius:0;padding:4px 18px 4px 0;font-size:13px;cursor:pointer;color:var(--fg);
  background-image:linear-gradient(45deg,transparent 50%,var(--fg3) 50%),linear-gradient(135deg,var(--fg3) 50%,transparent 50%);
  background-position:calc(100% - 7px) 55%,calc(100% - 3px) 55%;background-size:4px 4px;background-repeat:no-repeat}
.sel option{background:var(--raise-solid);color:var(--fg)}
.sel:hover{border-bottom-color:var(--fg3)}
.src{display:inline-flex;gap:10px;font-size:12.5px;color:var(--fg3)}
.src button{background:none;border:0;padding:2px 0;cursor:pointer;color:var(--fg3)}
.src button[aria-pressed="true"]{color:var(--fg);text-decoration:underline;text-decoration-color:var(--sage);text-underline-offset:4px}
.src button:disabled{cursor:not-allowed;opacity:.5}

/* ---------- right: readings ---------- */
.insp{position:fixed;z-index:4;right:calc(var(--gxr) + 12px);width:300px;max-height:calc(100% - var(--top) - var(--dock) - 30px);overflow:auto;
  background:var(--raise);border:1px solid var(--line);border-radius:6px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.insp header{display:flex;gap:10px;align-items:flex-start;padding:16px 18px 6px}
.insp h2{margin:0;font-family:var(--serif);font-weight:500;font-size:21px;line-height:1.15}
.insp .sub{font-size:12px;color:var(--fg3);margin-top:3px}
.insp .x{margin-left:auto;background:none;border:0;color:var(--fg3);cursor:pointer;font-size:12.5px;padding:2px 0;flex:none}
.insp .x:hover{color:var(--fg)}
.sec{padding:10px 18px 14px}
.sec + .sec{border-top:1px solid var(--line)}
.lab{font-size:11.5px;color:var(--fg3);margin-bottom:6px}
.row{display:grid;grid-template-columns:1fr auto;column-gap:10px;padding:8px 0 4px;cursor:pointer}
.row + .row{border-top:1px solid var(--line)}
.row .nm{font-size:13px;color:var(--fg)}
.row .nm small{display:block;font-size:11.5px;color:var(--fg3)}
.row .val{text-align:right;font-size:16px;font-variant-numeric:tabular-nums}
.row .val small{font-size:11.5px;color:var(--fg3);margin-left:3px}
.row[data-s="1"] .val{color:var(--ochre)} .row[data-s="2"] .val{color:var(--brick)}
.row .spark{grid-column:1/3;width:100%;height:26px;display:block;margin-top:4px}
.row:hover .nm{text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big b{font-family:var(--serif);font-weight:500;font-size:34px;font-variant-numeric:tabular-nums lining-nums;line-height:1}
.big span{color:var(--fg3);font-size:12.5px}
.dev{font-size:12.5px;color:var(--fg2);margin-top:4px}
.trend{display:block;width:100%;height:80px;margin-top:10px}
.zone{display:flex;gap:4px;margin-top:10px}
.zone div{flex:1;font-size:11px;text-align:center;padding:3px 0;border-radius:3px;color:var(--fg3);background:rgba(236,231,221,.05)}
.zone div.on{color:#1a1a1a;font-weight:600}
.props{margin:0;display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:7px 12px;font-size:12.5px}
.props dt{color:var(--fg3)} .props dd{margin:0;color:var(--fg2)}
.journal{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.journal li{display:flex;gap:12px}
.journal time{color:var(--fg3);font-variant-numeric:tabular-nums;flex:none}
.journal .l1{color:var(--slate)} .journal .l2{color:var(--ochre)} .journal .l3{color:var(--brick)} .journal .l0{color:var(--fg3)}
.note{font-size:12px;color:var(--fg3);line-height:1.5}

/* ---------- bottom: time and the two models ---------- */
.dock{position:fixed;z-index:5;left:0;right:0;bottom:0;padding:16px var(--gxr) calc(16px + env(safe-area-inset-bottom,0px)) var(--gx);
  background:linear-gradient(rgba(22,25,27,0),rgba(22,25,27,.92) 30%)}
.dock .in{margin:0 12px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 22px;align-items:center}
.play{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:rgba(236,231,221,.06);cursor:pointer;color:var(--fg);display:grid;place-items:center;font-size:12px}
.play:hover{background:rgba(236,231,221,.12)}
.tl{position:relative;height:36px;cursor:pointer;touch-action:none}
.tl canvas{position:absolute;inset:0;width:100%;height:100%}
.tl .head{position:absolute;top:-2px;bottom:12px;width:2px;margin-left:-1px;background:var(--fg);border-radius:1px;pointer-events:none}
.clock{text-align:right;font-variant-numeric:tabular-nums;line-height:1.3;white-space:nowrap}
.clock small{display:block;color:var(--fg3);font-size:11.5px}
.sub2{grid-column:2/4;display:flex;flex-wrap:wrap;gap:8px 28px;align-items:baseline;font-size:12.5px;color:var(--fg2)}
.sub2 .key{display:inline-flex;gap:12px;color:var(--fg3);font-size:11.5px}
.sub2 .key i{display:inline-block;width:10px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.model{display:inline-flex;align-items:baseline;gap:8px}
.model .nm{color:var(--fg3)}
.model .v{color:var(--fg);font-variant-numeric:tabular-nums;font-weight:500}
.model .st{font-size:11.5px;color:var(--fg3)}
.model.on .v{color:var(--ochre)} .model.on.l .v{color:var(--slate)}
.status{display:inline-flex;align-items:center;gap:8px;font-family:var(--serif);font-size:17px;color:var(--fg)}
.status i{width:9px;height:9px;border-radius:50%;background:var(--sage)}
.status[data-l="1"] i{background:var(--slate)} .status[data-l="2"] i{background:var(--ochre)} .status[data-l="3"] i{background:var(--brick)}
.status[data-l="3"]{color:#f1d3cb}
.ctrls{display:flex;gap:10px;align-items:center}
.step{background:none;border:0;color:var(--fg3);cursor:pointer;padding:4px;font-size:12px}
.step:hover{color:var(--fg)}
.livebadge{font-size:11.5px;color:var(--fg3)}
.livebadge.on{color:var(--sage)}

/* ---------- labels in the scene ---------- */
.tag{pointer-events:auto;cursor:pointer;display:inline-flex;align-items:baseline;gap:7px;padding:3px 9px 4px;border-radius:4px;background:rgba(22,25,27,.72);
  border:1px solid var(--line);white-space:nowrap;font-size:12px;line-height:1.3;font-variant-numeric:tabular-nums}
.tag .t{color:var(--fg3);font-size:11px}
.tag .v{color:var(--fg)}
.tag .v small{color:var(--fg3);margin-left:2px;font-size:11px}
.tag[data-s="1"] .v{color:var(--ochre)} .tag[data-s="2"] .v{color:var(--brick)}
.tag[data-s="2"]{border-color:rgba(201,113,93,.5)}
.tag.sel{border-color:var(--sage)}
.eq{pointer-events:auto;cursor:pointer;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--fg2);white-space:nowrap;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.eq b{font-style:normal;font-weight:500;color:var(--fg);margin-right:6px;font-size:14px}
.eq.sel{color:var(--fg)}
.flow{font-size:11.5px;color:var(--fg3);font-style:italic;font-family:var(--serif);white-space:nowrap;text-shadow:0 1px 6px rgba(0,0,0,.8)}

.toast{position:fixed;z-index:9;left:50%;transform:translateX(-50%);bottom:calc(var(--dock) + 10px);background:var(--raise-solid);border:1px solid var(--line2);border-radius:6px;padding:9px 14px;font-size:12.5px;color:var(--fg2);max-width:min(92vw,520px)}
.notesbtn{display:none}

@media (max-width:1100px){ .ctl{max-width:calc(100% - 40px);top:auto;bottom:calc(var(--dock) + 8px);right:calc(var(--gxr) + 12px)} }
@media (max-width:760px){
  .intro h1{font-size:25px}
  .now{font-size:15px;margin-top:8px;min-height:0}
  .views{margin-top:10px;gap:4px 14px}
  .ctl{left:calc(var(--gx) + 12px);right:auto;justify-content:flex-start;gap:10px}
  .insp{left:calc(var(--gx) + 6px);right:calc(var(--gxr) + 6px);width:auto;top:auto!important;bottom:calc(var(--dock) + 6px);max-height:58%}
  .insp[data-closed="true"]{display:none}
  .notesbtn{display:inline}
  .dock .in{grid-template-columns:auto minmax(0,1fr);margin:0 4px}
  .dock .clock{grid-column:1/3;text-align:left;display:flex;gap:10px;align-items:baseline}
  .dock .clock small{display:inline}
  .sub2{grid-column:1/3}
  .sub2 .key,.sub2 .step:not(.notesbtn),.sub2 #speed,.sub2 .livebadge{display:none}
  .sub2{gap:6px 18px}
  .ctl{bottom:auto}
}
@media (prefers-reduced-motion:reduce){ * {scroll-behavior:auto} }
</style>

</head>
<body>
<div id="stage"></div>
<div id="labels"></div>

<div class="intro" id="intro">
  <div class="kicker">GGS digital twin · V-101 and P-201</div>
  <h1>Inlet separator <em>&amp;</em> transfer pump</h1>
  <p class="now" id="now" aria-live="polite"></p>
  <nav class="views" id="views" aria-label="Camera views">
    <button data-v="overview" aria-pressed="true">Whole plant</button>
    <button data-v="vessel" aria-pressed="false">Separator</button>
    <button data-v="pump" aria-pressed="false">Pump</button>
    <button data-v="gas" aria-pressed="false">Gas detectors</button>
  </nav>
</div>

<div class="ctl" id="ctl">
  <select id="scen" class="sel" aria-label="Scenario"></select>
  <select id="run" class="sel" aria-label="Severity"></select>
  <span class="src" role="group" aria-label="Where the model scores come from">
    <button id="mRec" aria-pressed="true" title="Scores recorded from the team's API">Recorded</button>
    <button id="mLive" aria-pressed="false" disabled title="Open through run_twin.bat on the laptop to score live">Live</button>
  </span>
</div>

<aside class="insp" id="insp" aria-label="Readings" data-closed="true"></aside>

<section class="dock" id="dock">
  <div class="in">
    <div class="ctrls">
      <button class="play" id="play" aria-label="Pause">❚❚</button>

    <div class="tl" id="tl" role="slider" aria-label="Time in this run" tabindex="0" aria-valuemin="1" aria-valuemax="360" aria-valuenow="1">
      <canvas id="tlc"></canvas><div class="head" id="head"></div>

    <div class="sub2">

      <span class="model" id="ifM"><span class="nm">Isolation Forest</span><span class="v" id="ifV">—</span><span class="st" id="ifS"></span></span>
      <span class="model l" id="lsM"><span class="nm">LSTM autoencoder</span><span class="v" id="lsV">—</span><span class="st" id="lsS"></span></span>
      <button class="step" id="back" aria-label="Previous reading">◂ prev</button><button class="step" id="fwd" aria-label="Next reading">next ▸</button>
      <select id="speed" class="sel" aria-label="Playback speed"><option value="2">slow</option><option value="5" selected>normal speed</option><option value="12">fast</option></select>
      <span class="livebadge" id="live">recorded scores</span>
      <button class="step notesbtn" id="details">readings ▴</button>
      <span class="key"><span><i style="background:var(--slate)"></i>watch</span><span><i style="background:var(--ochre)"></i>alert</span><span><i style="background:var(--brick)"></i>both models</span><span><i style="background:rgba(236,231,221,.35)"></i>true fault period</span></span>
    </div>
  </div>
</section>

/* gas: a soft pale haze */
const GN=520, gPos=new Float32Array(GN*3).fill(-999), gVel=new Float32Array(GN*3), gAge=new Float32Array(GN).fill(99), gLife=new Float32Array(GN), gCol=new Float32Array(GN*3);
const gGeo=new THREE.BufferGeometry(); gGeo.setAttribute('position',new THREE.BufferAttribute(gPos,3)); gGeo.setAttribute('color',new THREE.BufferAttribute(gCol,3));
const plume=new THREE.Points(gGeo,new THREE.PointsMaterial({size:1.7,map:puff(),transparent:true,depthWrite:false,color:0xd9d3c7,opacity:.16}));

const leakAt=new THREE.Vector3(-VL/2-VR-0.42,VY,0); let gEmit=0;
function stepGas(level,dt){ gEmit=Math.min(gEmit+level*150*dt,4);
  for(let i=0;i<GN;i++){
    if(gAge[i]>gLife[i]){ if(gEmit>=1){ gEmit-=1; gAge[i]=0; gLife[i]=3+Math.random()*4;
        gPos[i*3]=leakAt.x-0.1; gPos[i*3+1]=leakAt.y+(Math.random()-.5)*0.3; gPos[i*3+2]=leakAt.z+(Math.random()-.5)*0.3;
        gVel[i*3]=-0.5-Math.random()*0.8; gVel[i*3+1]=(Math.random()-.3)*0.5; gVel[i*3+2]=(Math.random()-.5)*1.6; }
      else { gPos[i*3+1]=-999; continue; } }
    gAge[i]+=dt; const k=gAge[i]/gLife[i];
    gPos[i*3]+=(gVel[i*3]+0.1)*dt; gPos[i*3+1]+=gVel[i*3+1]*dt; gPos[i*3+2]+=gVel[i*3+2]*dt+Math.sin(gAge[i]*1.2+i)*0.004;
    if(gPos[i*3+1]<0.2) gVel[i*3+1]=Math.abs(gVel[i*3+1]);
    if(k>=1) gPos[i*3+1]=-999; }
  gGeo.attributes.position.needsUpdate=true; gGeo.attributes.color.needsUpdate=true; }

function dialTexture(){ const c=document.createElement('canvas'); c.width=c.height=256; const g=c.getContext('2d');
  g.fillStyle='#ece6da'; g.beginPath(); g.arc(128,128,124,0,Math.PI*2); g.fill();
  const a=v=>(-225+(v/500)*270)*Math.PI/180;
  g.lineWidth=12; g.strokeStyle='#9db196'; g.beginPath(); g.arc(128,128,98,a(250),a(350)); g.stroke();
  g.strokeStyle='#2a2a2a'; g.fillStyle='#2a2a2a'; g.font='500 19px Georgia, serif'; g.textAlign='center'; g.textBaseline='middle';
  for(let v=0;v<=500;v+=25){ const r=v%100===0?16:8, an=a(v); g.lineWidth=v%100===0?2.5:1.2;
    g.beginPath(); g.moveTo(128+Math.cos(an)*112,128+Math.sin(an)*112); g.lineTo(128+Math.cos(an)*(112-r),128+Math.sin(an)*(112-r)); g.stroke();
    if(v%100===0) g.fillText(v,128+Math.cos(an)*72,128+Math.sin(an)*72); }
  g.font='italic 16px Georgia, serif'; g.fillText('psig',128,178);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.center.set(.5,.5); t.rotation=Math.PI/2; return t; }
function puff(){ const c=document.createElement('canvas'); c.width=c.height=64; const g=c.getContext('2d'); const gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.55,'rgba(255,255,255,.35)'); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=gr; g.fillRect(0,0,64,64); return new THREE.CanvasTexture(c); }

/* ================= live scoring via run_twin.py ================= */
let apiOK=false;
async function probeApi(){ try{ const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),8000);
  const r=await fetch('api/health',{signal:ctl.signal,cache:'no-store'}); clearTimeout(t); if(!r.ok) return false;
  if(!(r.headers.get('content-type')||'').includes('json')) return false; const h=await r.json(); if(!h.if_model_loaded) return false;
  apiOK=true; $('mLive').disabled=false; $('mLive').title='Score every reading live with the team\'s API'; setMode(true);
  toast('Connected to the team\'s anomaly API on this laptop. Every reading is now scored live.'); return true; }catch(e){ return null; } }
(async()=>{ if(location.protocol!=='http:') return; for(let k=0;k<3;k++){ const ok=await probeApi(); if(ok!==null) return; await new Promise(r=>setTimeout(r,3000)); } })();
function setMode(live){ S.live=live&&apiOK; $('mRec').setAttribute('aria-pressed',String(!S.live)); $('mLive').setAttribute('aria-pressed',String(S.live));
  $('live').classList.toggle('on',S.live); $('live').textContent=S.live?'scored live on this laptop':'recorded scores';
  S.liveRes=[]; S.lastInt=-1; S.liveNext=0; if(S.live) startLiveStream(); buildJournalTo(Math.floor(S.pos)); drawTimeline(); }
$('mRec').onclick=()=>setMode(false); $('mLive').onclick=()=>setMode(true);
async function startLiveStream(){ S.liveStream='twin_'+S.run+'_'+Math.random().toString(36).slice(2,8); try{ await fetch('api/telemetry/reset_buffer?stream_id='+encodeURIComponent(S.liveStream),{method:'POST'}); }catch(e){} }
let liveRunning=false;
async function liveRunner(){ if(liveRunning) return; liveRunning=true; while(S.live&&S.liveNext<=S.liveTarget&&S.liveNext<S.n){ await scoreLive(S.liveNext); } liveRunning=false; }
function liveTick(t){ S.liveTarget=t; if(S.live) liveRunner(); }
const ALMAP={NONE:0,WATCH:1,ALERT:2,DUAL_MODEL_ALERT:3};
function reading(i,stream){ const R=S.R; return {stream_id:stream,run_id:S.run,timestamp:new Date(Date.parse(R.start)+i*10000).toISOString().replace('.000',''),
  separator_pressure_psig:R.p[i],separator_process_fluid_temp_c:R.t[i],pump_vibration_mms_rms:R.v[i],h2s_ppm:R.h[i],ch4_pct_lel:R.c[i]}; }
function keep(i,o){ S.liveRes[i]={if:o.if_anomaly_score,ls:o.lstm_reconstruction_error,al:ALMAP[o.alert_level]??0,buf:o.lstm_buffer_status?.filled??null}; }
async function scoreLive(i){ const stream=S.liveStream; S.livePending=true; const n=Math.min(60,Math.min(S.liveTarget,S.n-1)-i+1);
  try{ if(n>2){ const rs=[]; for(let k=0;k<n;k++) rs.push(reading(i+k,stream));
      const r=await fetch('api/telemetry/batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stream_id:stream,readings:rs})});
      if(!r.ok) throw new Error(r.status); const arr=await r.json(); if(stream===S.liveStream){ arr.forEach((o,k)=>keep(i+k,o)); S.liveNext=i+arr.length; } }
    else { const r=await fetch('api/telemetry/reading',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(reading(i,stream))});
      if(!r.ok) throw new Error(r.status); const o=await r.json(); if(stream===S.liveStream){ keep(i,o); S.liveNext=i+1; } } }
  catch(e){ toast('Lost the connection to the API, so the twin went back to recorded scores.'); setMode(false); }
  S.livePending=false; }

/* ================= journal ================= */
const journal=[];
function buildJournalTo(i){ journal.length=0; let prev=0; for(let k=0;k<=i;k++){ const s=scoresAt(k); if(s.pending) continue; if(s.al!==prev){ journal.push({i:k,a:s.al}); prev=s.al; } } }
function pushJournal(i){ const prev=journal.length?journal[journal.length-1].a:0, a=scoresAt(i).al; if(a!==prev) journal.push({i,a}); }

/* ================= the written account ================= */
function account(i,x,sc){
  if(sc.pending) return `Sending readings to the team's models on this laptop… <b>${Math.min(S.liveNext,i+1)}</b> of ${i+1} scored.`;
  let top=null, best=0; for(const k of TAGKEYS){ const s=sev(k,x[k]); if(s>best){ best=s; top=k; } }
  const desc = k => { const T=TAGS[k], d=x[k]-T.nom, cls=status(k,x[k])===2?'a':'w';
    return `<b>${T.short.charAt(0).toUpperCase()+T.short.slice(1)}</b> is at <span class="${cls}">${fmt(k,x[k])} ${T.unit}</span>, ${Math.abs(d).toFixed(T.dec)} ${d>0?'above':'below'} normal.`; };
  if(sc.al===3) return (top?desc(top)+' ':'')+'Both models agree something is wrong.';
  if(sc.al===2) return (top?desc(top)+' ':'This reading looks unusual as a whole. ')+'The Isolation Forest has flagged it; the LSTM has not yet.';
  if(sc.al===1) return `The LSTM has noticed <span class="s">an unusual pattern</span> over the last five minutes, though each reading on its own looks ordinary.`;
  if(top) return desc(top)+' Neither model has raised it yet.';
  if(sc.ls==null && !S.live) return 'All five instruments read close to normal. The LSTM is still collecting its first five minutes of readings.';
  return 'All five instruments read close to normal, and both models agree.';
}

function drawSeries(cv,k,i,win){ const r=cv.getBoundingClientRect(); if(!r.width) return; const dpr=Math.min(devicePixelRatio,2);
  if(cv.width!==Math.round(r.width*dpr)){ cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr); }
  const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); const W=r.width,H=r.height; g.clearRect(0,0,W,H);
  const a=Math.max(0,i-win+1), arr=S.R[k].slice(a,i+1), T=TAGS[k];
  let lo=Math.min(T.nom-T.tol*1.6,...arr), hi=Math.max(T.nom+T.tol*1.6,...arr); const pad=(hi-lo)*0.12; lo-=pad; hi+=pad;
  const X=j=>(j/(win-1))*(W-4)+2, Y=v=>H-3-((v-lo)/(hi-lo))*(H-6);
  g.fillStyle='rgba(157,177,150,.08)'; g.fillRect(0,Y(T.nom+T.tol),W,Y(T.nom-T.tol)-Y(T.nom+T.tol));
  const st=status(k,arr[arr.length-1]), col=st===2?C.brick:st===1?C.ochre:'#cfc8bb';
  g.beginPath(); arr.forEach((v,j)=>{ const xx=X(j+(win-arr.length)), y=Y(v); j?g.lineTo(xx,y):g.moveTo(xx,y); });
  g.strokeStyle=col; g.lineWidth=1.4; g.lineJoin='round'; g.stroke();
  g.fillStyle=col; g.beginPath(); g.arc(X(win-1),Y(arr[arr.length-1]),2.5,0,Math.PI*2); g.fill();
  if(H>60){ g.fillStyle=C.fg3; g.font='11px "IBM Plex Sans", sans-serif'; g.textAlign='right'; g.fillText(`last ${Math.round(win*10/60)} minutes`,W-2,11); } }
function updateInspector(){ const i=Math.floor(S.pos), x=sensorsAt(S.pos);

function seek(i){ i=clamp(i,0,S.n-1); S.pos=i; S.lastInt=i-1; if(S.live){ S.liveRes=[]; S.liveNext=i; startLiveStream(); } buildJournalTo(i); drawTimeline(); }
const tl=$('tl'), tlc=$('tlc');
function drawTimeline(){ const r=tl.getBoundingClientRect(); if(!r.width) return; const dpr=Math.min(devicePixelRatio,2);
  tlc.width=Math.round(r.width*dpr); tlc.height=Math.round(r.height*dpr); const g=tlc.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  const W=r.width,H=r.height,n=S.n,bw=W/n,mid=11; g.clearRect(0,0,W,H);
  // the true fault period: a soft band behind everything
  for(let i=0;i<n;i++){ const p=S.R.ph[i]; if(p){ g.fillStyle=`rgba(236,231,221,${[0,.07,.12,.06][p]})`; g.fillRect(i*bw,0,bw+0.6,22); } }
  g.fillStyle='rgba(236,231,221,.16)'; g.fillRect(0,mid-0.5,W,1);
  const AC=[null,C.slate,C.ochre,C.brick];
  for(let i=0;i<n;i++){ const s=scoresAt(i); if(s.pending||!s.al) continue; g.fillStyle=AC[s.al]; const h=[0,6,9,12][s.al]; g.fillRect(i*bw,mid-h/2,bw+0.6,h); }
  g.fillStyle=C.fg3; g.font='10.5px "IBM Plex Sans", sans-serif'; g.textBaseline='bottom';
  for(let m=0;m<=60;m+=10){ const xx=(m*6/(n-1))*W; g.fillRect(Math.min(W-1,xx),22,1,3); if(m>0&&m<60){ g.textAlign='center'; g.fillText(m+' min',xx,H); } } }

/* ================= loop ================= */
const clock=new THREE.Clock(); let tAcc=0, lastT=performance.now(), lastHud=0; const amb={p:300,v:1.8,gas:0};
const ochre=new THREE.Color(C.ochre), brick=new THREE.Color(C.brick), sageC=new THREE.Color(C.sage), tmpC=new THREE.Color();
function frame(){
  const dt=Math.min(clock.getDelta(),0.05); tAcc+=dt; const now=performance.now(), rdt=(now-lastT)/1000; lastT=now;
  if(S.playing){ const next=S.pos+dt*S.speed;
    if(S.live){ const need=Math.min(Math.floor(next),S.n-1); liveTick(need); if(S.liveRes[need]) S.pos=Math.min(next,S.n-1); } else S.pos=Math.min(next,S.n-1);
    if(S.pos>=S.n-1){ S.pos=S.n-1; setPlaying(false); } }
  else if(S.live) liveTick(Math.floor(S.pos));

  if(i!==S.lastInt){ for(let k=S.lastInt+1;k<=i;k++){ if(k>=0&&(!S.live||S.liveRes[k])) pushJournal(k); } if(!S.live||S.liveRes[i]) S.lastInt=i; if(S.live) drawTimeline(); }
  const x=sensorsAt(S.pos); amb.p=lerp(amb.p,x.p,0.2); amb.v=lerp(amb.v,x.v,0.2);
  const ps=sev('p',amb.p); tmpC.copy(ochre).lerp(brick,clamp((ps-0.3)/0.5,0,1)); M.shell.emissive.copy(tmpC).multiplyScalar(ps*0.24);
  const vs=sev('v',amb.v); tmpC.copy(ochre).lerp(brick,clamp((vs-0.3)/0.5,0,1)); M.pump.emissive.copy(tmpC).multiplyScalar(vs*0.2);
  needlePivot.rotation.z=-((-225+(clamp(amb.p,0,500)/500)*270)*Math.PI/180)-Math.PI/2;
  const fs=clamp(amb.p/300,0.3,1.6); stepFlow(flows[0],1.4*fs,dt); stepFlow(flows[1],1.0*fs,dt); stepFlow(flows[2],1.3*fs,dt); stepFlow(flows[3],1.8*fs,dt);
  coupling.rotation.x+=dt*(RM?5:20);
  const amp=clamp((amb.v-1.8)*0.011,0,0.055)*(RM?0.3:1);
  pump.position.set(pumpBase.x+Math.sin(tAcc*71)*amp, pumpBase.y+Math.sin(tAcc*53+1)*amp*0.6, pumpBase.z+Math.cos(tAcc*67)*amp);
  vibRings.forEach((r,j)=>{ const ph=(tAcc*0.7+j/3)%1; r.scale.setScalar(1+ph*2.4); r.material.opacity=vs*(1-ph)*0.7; });
  const gl=clamp(Math.max((x.h-0.5)/12,(x.c-3)/24),0,1); amb.gas=lerp(amb.gas,gl,0.1); stepGas(amb.gas,RM?dt*0.5:dt);
  for(const [g,k] of [[at301,'h'],[at302,'c']]){ const st=status(k,x[k]), m=g.userData.beacon; m.emissive.set(st===2?C.brick:st===1?C.ochre:C.sage);
    m.emissiveIntensity = st===2 ? (RM?1.2:0.7+0.6*Math.max(0,Math.sin(tAcc*5))) : st===1?0.9:0.35; }
  if(selRing.visible) selRing.material.opacity=0.45+0.25*Math.sin(tAcc*2.5);
  if(tween){ tween.t=Math.min(1,tween.t+rdt/1.1); const e=tween.t<.5?4*tween.t**3:1-Math.pow(-2*tween.t+2,3)/2;
    camera.position.lerpVectors(tween.p0,tween.p1,e); controls.target.lerpVectors(tween.t0,tween.t1,e); if(tween.t>=1) tween=null; }
  controls.update(); renderer.render(scene,camera); labelR.render(scene,camera);
  if(tAcc-lastHud>0.08){ lastHud=tAcc; hud(); updateInspector(); }
  requestAnimationFrame(frame); }

function layout(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h); labelR.setSize(w,h); camera.aspect=w/h; camera.fov=w<760?52:36; camera.updateProjectionMatrix();
